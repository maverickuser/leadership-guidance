schema: spec-driven

context: |
  Project: Newsletter Archive — a private, local archive of posts on https://www.example.com
  that the user subscribes to. Personal use only; never shared or published.
  Tech stack: Python 3.11+, pyproject.toml, console entry point `archive`.
  Site: Ghost CMS; login cookies ghost-members-ssr + ghost-members-ssr.sig; categories are Ghost tags.
  Libraries: requests, trafilatura, beautifulsoup4 + lxml, typer, pyyaml, python-dotenv, pytest.
  Runs locally on macOS. No cloud services, except the Gemini API (user's own key in .env as
  GEMINI_API_KEY) for embeddings and one-time post summaries.
  Hard rules: polite scraping (one request at a time, >= 2s apart); subscriber cookie only,
  never bypass the paywall; the cookie and the API key live only in .env and are never printed,
  logged or committed.
  Tests are offline (saved HTML fixtures, mocked HTTP).
  Phase 2 (add-hybrid-search): searchable store built from the post JSON; BM25 + semantic search
  (gemini-embedding-2) over passages and per-post summaries, combined and re-ranked; exposed only through a local MCP server (`search` tool)
  for agents like Claude Code. The server returns data; the calling agent writes the answer.

rules:
  tasks:
    - Do not run a full crawl; the first live run is `archive run --limit 5`, after the user fills in .env
